name: paperless          # fixiert Volume-Namen unabhängig vom Deploy-Pfad

services:
  ts-paperless:
    image: tailscale/tailscale:v1.98.8
    container_name: ts-paperless
    hostname: paperless                  # → paperless.<tailnet>.ts.net
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ts_state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [net_admin, net_raw]
    networks: [edge]
    restart: unless-stopped

  broker:
    image: docker.io/library/redis:7.4-alpine
    container_name: paperless-redis
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:17-alpine
    container_name: paperless-db
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${PAPERLESS_DBPASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.24.0
    container_name: paperless-gotenberg
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks: [backend]
    restart: unless-stopped

  tika:
    image: docker.io/apache/tika:2.9.2.1-full
    container_name: paperless-tika
    networks: [backend]
    restart: unless-stopped

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.18.4
    container_name: paperless-web
    ports:
      - "${PAPERLESS_BIND_IP:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    environment:
      # --- Anbindung ---
      - PAPERLESS_REDIS=redis://broker:6379
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DBPASS}
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      # --- URL / CSRF (Pflicht!) ---
      - PAPERLESS_URL=${PAPERLESS_URL}
      - PAPERLESS_CSRF_TRUSTED_ORIGINS=${PAPERLESS_CSRF_TRUSTED_ORIGINS}
      - PAPERLESS_ALLOWED_HOSTS=${PAPERLESS_ALLOWED_HOSTS}
      # --- Lokalisierung ---
      - PAPERLESS_OCR_LANGUAGE=deu+eng
      - PAPERLESS_OCR_LANGUAGES=deu eng
      - PAPERLESS_TIME_ZONE=Europe/Vienna
      - PAPERLESS_FILENAME_FORMAT={{ correspondent }}/{{ created_year }}/{{ created_year }}-{{ created_month }}-{{ created_day }}_{{ title }}_{{ document_type }}
      # --- Secrets ---
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      # --- Dateirechte ---
      - USERMAP_UID=${USERMAP_UID}
      - USERMAP_GID=${USERMAP_GID}
    volumes:
      - data:/usr/src/paperless/data
      - ${PAPERLESS_MEDIA_DIR}:/usr/src/paperless/media
      - ${PAPERLESS_CONSUME_DIR}:/usr/src/paperless/consume
      - ${PAPERLESS_EXPORT_DIR}:/usr/src/paperless/export
    networks: [edge, backend]
    restart: unless-stopped
    # bewusst keine ports: — Zugriff ausschließlich über den Sidecar

networks:
  edge:
    external: true
  backend:
    internal: true          # kein Internetzugang für DB/Redis/Tika/Gotenberg

volumes:
  ts_state:
  pgdata:
  redisdata:
  data:
